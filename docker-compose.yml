services:
  postgres:
    image: postgres:16-alpine
    container_name: dp-sheet-music-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # Isso aqui liga a minha porta 5432 do meu host com a porta 5432 do container.
      # É uma forma de informar o container que ele deve rodar na porta 5432, que, rodando localmente seria meu localhost.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeuout: 5s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["app"]
    build: .
    container_name: dp-sheet-music-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE: local
      - SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

volumes:
  postgres_data:
